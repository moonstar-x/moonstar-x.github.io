name: '#Callable - Deploy'

on:
  workflow_call:
    inputs:
      base_url:
        required: true
        type: string
      umami_src:
        required: true
        type: string
      umami_id:
        required: true
        type: string
      publish_dir:
        required: true
        type: string
    secrets:
      machine_account_token:
        required: true

jobs:
  deploy:
    name: Deploy Site
    runs-on: ubuntu-latest

    steps:
      - name: Checkout the Repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Build Site
        run: npm run build
        env:
          NEXT_BASE_URL: ${{ inputs.base_url }}
          NEXT_ANALYTICS_UMAMI_SRC: ${{ inputs.umami_src }}
          NEXT_ANALYTICS_UMAMI_WEBSITE_ID: ${{ inputs.umami_id }}

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.machine_account_token }}
          publish_dir: ${{ inputs.publish_dir }}
          allow_empty_commit: true
          commit_message: ${{ inputs.commit_message }}
